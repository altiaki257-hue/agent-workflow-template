description: Synthetic workflow diagnostics; offline fixture mode unless explicitly opted in
prompts:
  - "{{question}}"
providers:
  - id: file://../scripts/promptfoo_provider.py
    label: direct
    config:
      route: direct
  - id: file://../scripts/promptfoo_provider.py
    label: reviewed-and-synthesized
    config:
      route: review
tests: file://cases.json
defaultTest:
  assert:
    - type: python
      value: file://../scripts/evaluation_assertions.py
sharing: false
evaluateOptions:
  maxConcurrency: 1
