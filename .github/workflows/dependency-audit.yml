name: Dependency audit

on:
  workflow_dispatch:
  schedule:
    - cron: "29 18 * * 1"

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        requirement: [requirements-dev.txt, requirements-audit.txt]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned auditor
        run: python -m pip install -r requirements-audit.txt
      - name: Audit dependency environment
        run: pip-audit -r "${{ matrix.requirement }}" --strict --desc off --progress-spinner off
