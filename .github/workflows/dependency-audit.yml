name: Dependency audit

on:
  workflow_dispatch:
  schedule:
    - cron: "29 18 * * 1"

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        requirement: [requirements-dev.txt, requirements-audit.txt]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned auditor
        run: python -m pip install -r requirements-audit.txt
      - name: Audit dependency environment
        run: pip-audit -r "${{ matrix.requirement }}" --strict --desc off --progress-spinner off
