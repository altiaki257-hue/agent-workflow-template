name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: workflow-checks (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Lint configuration, links, and secrets
        run: python scripts/validate_repo.py
      - name: Install test measurement dependencies
        run: python -m pip install hypothesis==6.170.1 coverage==7.16.2
      - name: Run policy regression tests
        env:
          COVERAGE_FILE: ${{ runner.temp }}/repository.coverage
        run: python -m coverage run --branch --source=scripts -m unittest discover -s tests -v
      - name: Report statement and branch coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/repository.coverage
        run: python -m coverage report --skip-covered

  quality:
    name: quality-tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python correctness
        run: python -m pre_commit run ruff-check --all-files
      - name: Check Python types
        run: basedpyright
      - name: Install local security checker
        run: python scripts/security_scan.py install
      - name: Verify security rule controls
        run: python scripts/security_scan.py controls
      - name: Check agent security boundaries
        run: python scripts/security_scan.py scan
      - name: Check GitHub Actions workflows
        run: python -m pre_commit run actionlint --all-files
      - name: Scan full available Git history
        run: python -m pre_commit run gitleaks-history --hook-stage manual --all-files

  repository-policy:
    name: repository-policy
    if: ${{ always() }}
    needs: [checks, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all platforms to pass
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$CHECK_RESULT" = success && test "$QUALITY_RESULT" = success
