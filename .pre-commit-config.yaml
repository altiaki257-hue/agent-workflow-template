minimum_pre_commit_version: "4.7.0"
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: [-shellcheck=, -pyflakes=]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks git --pre-commit --redact --staged --no-banner --log-level error
      - id: gitleaks
        alias: gitleaks-history
        name: Scan all available Git history for secrets
        entry: gitleaks git --redact --no-banner --log-level error --log-opts=--all
        stages: [manual]
        always_run: true
  - repo: local
    hooks:
      - id: repository-policy
        name: Repository policy, links and current-file secrets
        entry: python scripts/validate_repo.py
        language: python
        pass_filenames: false
        always_run: true
